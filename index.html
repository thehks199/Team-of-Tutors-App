<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team of Tutors</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f1f5f9;
    color:#172b4d;
    padding-bottom:90px;
}

/* ================= HEADER ================= */

.header{
    background:#075985;
    color:#fff;
    padding:22px 18px 25px;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.header-top{
    display:flex;
    align-items:center;
}

.logo{
    width:58px;
    height:58px;
    background:#fff;
    color:#075985;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:21px;
    font-weight:bold;
    flex-shrink:0;
}

.title{
    flex:1;
    margin-left:14px;
}

.title h1{
    font-size:22px;
    line-height:1.2;
}

.title p{
    font-size:12px;
    margin-top:5px;
    opacity:.9;
}

.notification{
    font-size:28px;
    cursor:pointer;
    margin-left:8px;
}

/* ================= PROFILE ================= */

.profile{
    background:#fff;
    margin:18px 15px;
    padding:18px;
    border-radius:18px;
    display:flex;
    align-items:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.profile-pic{
    width:65px;
    height:65px;
    background:#dbeafe;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:31px;
    flex-shrink:0;
}

.profile-info{
    margin-left:15px;
}

.profile-info h2{
    font-size:18px;
    color:#172b4d;
}

.profile-info p{
    color:#64748b;
    font-size:12px;
    margin-top:5px;
}

/* ================= CARD ================= */

.card-box{
    background:#fff;
    margin:15px;
    padding:18px;
    border-radius:17px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.card-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.card-heading h3{
    font-size:16px;
}

.badge{
    padding:6px 10px;
    border-radius:20px;
    background:#fef3c7;
    color:#92400e;
    font-size:10px;
    font-weight:bold;
}

/* ================= FACE VERIFICATION ================= */

.face-description{
    color:#64748b;
    font-size:12px;
    line-height:1.5;
    margin-top:8px;
}

.camera-container{
    display:none;
    position:relative;
    width:100%;
    margin-top:15px;
    overflow:hidden;
    border-radius:14px;
    background:#111827;
}

.camera-container video{
    display:block;
    width:100%;
    min-height:260px;
    object-fit:cover;
    transform:scaleX(-1);
}

.face-outline{
    position:absolute;
    width:55%;
    height:70%;
    left:22.5%;
    top:15%;
    border:3px solid #fff;
    border-radius:50%;
    box-shadow:0 0 20px rgba(255,255,255,.35);
}

.scan-line{
    position:absolute;
    left:18%;
    width:64%;
    height:3px;
    top:18%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
    animation:scan 2s infinite;
}

@keyframes scan{
    0%{top:18%}
    50%{top:78%}
    100%{top:18%}
}

.face-button{
    width:100%;
    margin-top:15px;
    border:none;
    border-radius:11px;
    padding:14px;
    background:#0f766e;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.face-button:active{
    transform:scale(.98);
}

.face-result{
    display:none;
    margin-top:12px;
    padding:13px;
    border-radius:11px;
    background:#dcfce7;
    color:#166534;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

/* ================= LOCATION ================= */

.location{
    background:#f8fafc;
    padding:12px;
    margin-top:14px;
    border-radius:10px;
    font-size:13px;
}

.attendance-button{
    width:100%;
    border:none;
    background:#075985;
    color:#fff;
    padding:14px;
    margin-top:14px;
    border-radius:11px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

/* ================= SECTION ================= */

.section-title{
    margin:22px 15px 11px;
    font-size:17px;
    font-weight:bold;
}

/* ================= SERVICE GRID ================= */

.services{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 15px;
}

.service{
    background:#fff;
    padding:19px 12px;
    text-align:center;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
    cursor
