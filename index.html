<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team of Tutors</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f2f5f9;
    color:#172b4d;
    padding-bottom:80px;
}

.header{
    background:#075985;
    color:white;
    padding:20px 18px 25px;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header-top{
    display:flex;
    align-items:center;
}

.logo{
    width:50px;
    height:50px;
    border-radius:50%;
    background:white;
    color:#075985;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.title{
    flex:1;
    margin-left:12px;
}

.title h1{
    font-size:20px;
}

.title p{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.notification{
    font-size:24px;
}

.profile{
    background:white;
    margin:15px;
    padding:18px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
}

.profile-pic{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#dbeafe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.profile-info{
    margin-left:14px;
}

.profile-info h2{
    font-size:17px;
}

.profile-info p{
    font-size:12px;
    color:#64748b;
    margin-top:4px;
}

.status-card,
.face-card{
    margin:15px;
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.status-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.status-header h3{
    font-size:16px;
}

.badge{
    background:#fef3c7;
    color:#92400e;
    padding:5px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.location{
    margin-top:15px;
    background:#f8fafc;
    padding:12px;
    border-radius:10px;
    font-size:13px;
}

.attendance-btn,
.face-btn{
    width:100%;
    margin-top:15px;
    border:none;
    background:#075985;
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.face-btn{
    background:#0f766e;
}

.section-title{
    margin:20px 15px 10px;
    font-size:16px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px 12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    cursor:pointer;
}

.card:active{
    transform:scale(.97);
}

.card-icon{
    font-size:28px;
    margin-bottom:8px;
}

.card h4{
    font-size:14px;
}

.card p{
    font-size:10px;
    color:#64748b;
    margin-top:4px;
}

/* FACE VERIFICATION */

.face-card h3{
    font-size:16px;
}

.face-card p{
    font-size:12px;
    color:#64748b;
    margin-top:5px;
    line-height:1.5;
}

.camera{
    display:none;
    margin-top:15px;
    position:relative;
    background:#111827;
    border-radius:12px;
    overflow:hidden;
}

.camera video{
    width:100%;
    display:block;
    transform:scaleX(-1);
}

.scan-line{
    position:absolute;
    left:10%;
    right:10%;
    height:3px;
    background:#22c55e;
    top:20%;
    box-shadow:0 0 12px #22c55e;
    animation:scan 2s infinite;
}

@keyframes scan{
    0%{top:20%}
    50%{top:75%}
    100%{top:20%}
}

.camera-frame{
    position:absolute;
    top:15%;
    left:20%;
    width:60%;
    height:70%;
    border:3px solid rgba(255,255,255,.8);
    border-radius:50%;
}

.verification-status{
    display:none;
    margin-top:15px;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    font-size:13px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.notice{
    margin:15px;
    background:white;
    border-left:5px solid #075985;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.notice h3{
    font-size:14px;
    margin-bottom:6px;
}

.notice p{
    font-size:12px;
    color:#64748b;
    line-height:1.5;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -3px 15px rgba(0,0,0,.12);
    z-index:100;
}

.nav-item{
    text-align:center;
    color:#64748b;
    font-size:10px;
}

.nav-item span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#075985;
    font-weight:bold;
}

@media(min-width:700px){

    body{
        max-width:600px;
        margin:auto;
    }

    .bottom-nav{
        max-width:600px;
        margin:auto;
    }
}
</style>
</head>

        <div class="title">

    </div>

</div>
