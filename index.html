<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team of Tutors</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f2f5f9;
    color:#172b4d;
    padding-bottom:80px;
}

/* ================= HEADER ================= */

.header{
    background:#075985;
    color:white;
    padding:20px 18px 25px;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    width:50px;
    height:50px;
    border-radius:50%;
    background:white;
    color:#075985;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
}

.title{
    flex:1;
    margin-left:12px;
}

.title h1{
    font-size:20px;
}

.title p{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.notification{
    font-size:24px;
    cursor:pointer;
}

/* ================= PROFILE ================= */

.profile{
    background:white;
    margin:15px;
    padding:18px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
}

.profile-pic{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#dbeafe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    flex-shrink:0;
}

.profile-info{
    margin-left:14px;
}

.profile-info h2{
    font-size:17px;
    margin-bottom:5px;
}

.profile-info p{
    font-size:12px;
    color:#64748b;
    margin-top:4px;
}

/* ================= GENERAL CARDS ================= */

.status-card,
.face-card{
    margin:15px;
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.status-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.status-header h3{
    font-size:16px;
}

.badge{
    background:#fef3c7;
    color:#92400e;
    padding:5px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

/* ================= LOCATION ================= */

.location{
    margin-top:15px;
    background:#f8fafc;
    padding:12px;
    border-radius:10px;
    font-size:13px;
}

/* ================= BUTTONS ================= */

.attendance-btn,
.face-btn{
    width:100%;
    margin-top:15px;
    border:none;
    background:#075985;
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.attendance-btn:active,
.face-btn:active{
    transform:scale(.98);
}

.face-btn{
    background:#0f766e;
}

/* ================= FACE VERIFICATION ================= */

.face-description{
    font-size:12px;
    color:#64748b;
    line-height:1.5;
    margin-top:8px;
}

.camera-box{
    display:none;
    position:relative;
    margin-top:15px;
    background:#111827;
    border-radius:12px;
    overflow:hidden;
}

.camera-box video{
    width:100%;
    display:block;
    transform:scaleX(-1);
}

.face-frame{
    position:absolute;
    top:12%;
    left:22%;
    width:56%;
    height:76%;
    border:3px solid white;
    border-radius:50%;
    box-shadow:0 0 15px rgba(255,255,255,.5);
}

.scan-line{
    position:absolute;
    left:20%;
    right:20%;
    height:3px;
    background:#22c55e;
    top:20%;
    box-shadow:0 0 12px #22c55e;
    animation:faceScan 2s infinite;
}

@keyframes faceScan{

    0%{
        top:20%;
    }

    50%{
        top:75%;
    }

    100%{
        top:20%;
    }

}

.face-result{
    display:none;
    margin-top:12px;
    padding:13px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

/* ================= SERVICES ================= */

.section-title{
    margin:20px 15px 10px;
    font-size:16px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px 12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    cursor:pointer;
    transition:.2s;
}

.card:active{
    transform:scale(.97);
}

.card-icon{
    font-size:28px;
    margin-bottom:8px;
}

.card h4{
    font-size:14px;
}

.card p{
    font-size:10px;
    color:#64748b;
    margin-top:4px;
}

/* ================= NOTICE ================= */

.notice{
    margin:15px;
    background:white;
    border-left:5px solid #075985;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.notice h3{
    font-size:14px;
    margin-bottom:6px;
}

.notice p{
    font-size:12px;
    color:#64748b;
    line-height:1.5;
}

/* ================= BOTTOM NAVIGATION ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -3px 15px rgba(0,0,0,.12);
    z-index:100;
}

.nav-item{
    text-align:center;
    color:#64748b;
    font-size:10px;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#075985;
    font-weight:bold;
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

    body{
        max-width:600px;
        margin:auto;
    }

    .bottom-nav{
        max-width:600px;
        margin:auto;
    }

}

</style>

</head>

<body>

</div>
